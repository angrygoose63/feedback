<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASS FEEDBACK</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7385; --line:#e3e7ef; --accent:#4f46e5; --ok:#16a34a; --mid:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; }
  h1 { margin:0; font-size:1.2rem; letter-spacing:.12em; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:9px 16px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); border-color:var(--bad); }
  main { max-width:640px; margin:0 auto; padding:0 20px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 4px 20px rgba(20,30,60,.05); margin-bottom:20px; }
  .center { text-align:center; }
  #student h2 { margin:40px 0 28px; font-size:1.6rem; }
  .votes { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .votes button { flex:1 1 140px; font-size:1.2rem; padding:22px 10px; border-radius:14px; }
  .votes button:disabled { opacity:.5; cursor:default; }
  #msg { margin-top:24px; min-height:1.5em; font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--bad); }
  input { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .bar-row { margin:16px 0; }
  .bar-label { display:flex; justify-content:space-between; margin-bottom:6px; font-size:.95rem; }
  .track { background:#eef1f7; border-radius:8px; height:22px; overflow:hidden; }
  .fill { height:100%; width:0; transition:width .4s; }
  h3 { margin:0 0 12px; font-size:1.05rem; }
  .small { color:var(--muted); font-size:.85rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>CLASS FEEDBACK</h1>
  <button id="loginBtn">관리자 로그인</button>
</header>
<main>
  <section id="student" class="center">
    <h2>오늘 수업은 어땠나요?</h2>
    <div class="votes">
      <button data-r="satisfied">😊 만족</button>
      <button data-r="neutral">😐 보통</button>
      <button data-r="dissatisfied">😞 불만족</button>
    </div>
    <div id="msg"></div>
  </section>

  <section id="login" class="card" hidden>
    <h3>관리자 로그인</h3>
    <form id="loginForm">
      <input type="email" id="email" placeholder="이메일" autocomplete="username" required>
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
      <div class="row" style="margin:0">
        <button class="primary" type="submit">로그인</button>
        <button type="button" id="cancelLogin">취소</button>
      </div>
      <div id="loginMsg" class="err" style="margin-top:12px"></div>
    </form>
  </section>

  <section id="admin" hidden>
    <div class="card">
      <h3>수업 만족도 결과 <span class="small" id="total"></span></h3>
      <div id="bars"></div>
      <div class="row" style="margin:24px 0 0">
        <button id="refresh">결과 새로고침</button>
        <button id="reset" class="danger">투표 결과 초기화</button>
        <button id="logout">로그아웃</button>
      </div>
    </div>
    <div class="card">
      <h3>관리자 계정 바꾸기</h3>
      <p class="small">새 이메일을 입력하면 인증 메일이 발송되며, 메일의 링크를 확인하면 관리자 이메일이 변경됩니다.</p>
      <form id="emailForm">
        <input type="email" id="newEmail" placeholder="새 관리자 이메일" required>
        <button class="primary" type="submit">인증 메일 보내기</button>
        <div id="emailMsg" style="margin-top:12px"></div>
      </form>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
const LABELS = { satisfied:['😊 만족','var(--ok)'], neutral:['😐 보통','var(--mid)'], dissatisfied:['😞 불만족','var(--bad)'] };

function show(view) {
  $('student').hidden = view !== 'student';
  $('login').hidden = view !== 'login';
  $('admin').hidden = view !== 'admin';
  $('loginBtn').hidden = view !== 'student';
}

document.querySelectorAll('.votes button').forEach(b => b.onclick = async () => {
  const btns = document.querySelectorAll('.votes button');
  btns.forEach(x => x.disabled = true);
  const { error } = await sb.from('votes').insert({ rating: b.dataset.r });
  $('msg').className = error ? 'err' : 'ok';
  $('msg').textContent = error ? '저장에 실패했습니다. 다시 시도해 주세요.' : '투표가 완료되었습니다. 감사합니다.';
  btns.forEach(x => x.disabled = false);
});

$('loginBtn').onclick = () => show('login');
$('cancelLogin').onclick = () => show('student');

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
  if (error) { $('loginMsg').textContent = '로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.'; return; }
  $('password').value = '';
  await openAdmin();
};

async function loadResults() {
  const { data, error } = await sb.from('votes').select('rating');
  if (error) { alert('결과를 불러오지 못했습니다.'); return; }
  const counts = { satisfied:0, neutral:0, dissatisfied:0 };
  data.forEach(v => counts[v.rating]++);
  const total = data.length;
  $('total').textContent = `· 전체 ${total}표`;
  $('bars').innerHTML = Object.keys(LABELS).map(k => {
    const pct = total ? Math.round(counts[k] / total * 1000) / 10 : 0;
    return `<div class="bar-row"><div class="bar-label"><span>${LABELS[k][0]}</span><span>${counts[k]}표 (${pct}%)</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${LABELS[k][1]}"></div></div></div>`;
  }).join('');
}

async function openAdmin() { show('admin'); await loadResults(); }

$('refresh').onclick = loadResults;

$('reset').onclick = async () => {
  if (!confirm('모든 투표 결과를 초기화하시겠습니까? 삭제된 결과는 복구할 수 없습니다.')) return;
  const { error } = await sb.from('votes').delete().gt('id', 0);
  if (error) { alert('초기화에 실패했습니다.'); return; }
  await loadResults();
};

$('logout').onclick = async () => { await sb.auth.signOut(); $('msg').textContent = ''; show('student'); };

$('emailForm').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.updateUser({ email: $('newEmail').value }, { emailRedirectTo: location.origin });
  $('emailMsg').className = error ? 'err' : 'ok';
  $('emailMsg').textContent = error ? '요청에 실패했습니다: ' + error.message : '인증 메일을 보냈습니다. 메일의 링크를 확인하면 변경이 완료됩니다.';
};

sb.auth.getSession().then(({ data }) => { if (data.session) openAdmin(); else show('student'); });
sb.auth.onAuthStateChange((ev, s) => { if (ev === 'USER_UPDATED' && s) openAdmin(); });
</script>
</body>
</html>
